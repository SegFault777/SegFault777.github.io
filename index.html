<style>
  /* MiniWin view: sits under the header in normal flow, so the header is never covered */
  body.miniwin-open { height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  body.miniwin-open > header.top { position:static !important; flex:0 0 auto; }
  #miniwinView { display:none; }
  #miniwinView.open { display:flex; flex:1 1 auto; min-height:0; background:#000; }
  #miniwinView.open iframe { flex:1 1 auto; width:100%; height:100%; border:0; display:block; }
  body.miniwin-open main { display:none; }
  /* Settings over the home page: a transparent layer that only the settings window draws in */
  #miniwinView.settings-only { display:block; position:fixed; inset:0; z-index:500; background:transparent; }
  #miniwinView.settings-only iframe { width:100%; height:100%; border:0; display:block; background:transparent; }
  #miniwinView.hidden-frame iframe { }
  .back-home { position:fixed; right:12px; bottom:12px; z-index:6; padding:6px 10px; cursor:pointer; font:inherit; }
  #mainStyleSwitch { display:inline-flex; align-items:center; }
  #devNotice { position:fixed; left:50%; top:90px; transform:translateX(-50%); z-index:700;
    padding:10px 18px; border:1px solid currentColor; border-radius:6px; background:var(--bg-panel, #ffffff);
    color:inherit; font:inherit; box-shadow:0 6px 18px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .25s; }
  #devNotice.show { opacity:1; }
</style>

<script>
(function () {
  var frame = document.getElementById("miniwinFrame");
  var view = document.getElementById("miniwinView");
  var back = document.getElementById("backHome");
  var gear = document.getElementById("settingsGear");
  var slot = document.getElementById("mainStyleSwitch");
  var links = document.querySelectorAll("[data-view]");
  var navLinks = document.querySelectorAll("nav.nav a[data-view]");
  var miniwinOpen = false;
  var ready = false, queue = [];
  var loadedSheets = {};

  /* Every request to MiniWin goes through here: it waits until MiniWin has loaded. */
  function send(msg) {
    if (ready && frame.contentWindow) frame.contentWindow.postMessage(msg, "*");
    else queue.push(msg);
  }

  function keepClasses(cls) {
    return (cls || "").split(/\s+/).filter(function (c) { return c && c !== "ms-settings-only" && c !== "miniwin-open"; }).join(" ");
  }

  function applyBodyClasses(state) {
    document.documentElement.className = keepClasses(state.html);
    document.body.className = (keepClasses(state.body) + (miniwinOpen ? " miniwin-open" : "")).replace(/\s+/g, " ").trim();
    syncOldRetroHome();
  }

  /* OldRetro on the home page: the same DOS-blue text screen MiniWin uses, showing the home content. */
  var orScreen = null, orBody = null, orStatus = null, orBuf = "", orKeysBound = false;

  function buildOldRetroHome() {
    if (orScreen) return;
    orScreen = document.createElement("div");
    orScreen.id = "oldretroScreen";
    orScreen.innerHTML =
      '<div class="or-titlebar">SEGFAULT777.EXE \u2014 TEXT MODE HOME</div>' +
      '<div class="or-menubar" id="orHomeMenu"></div>' +
      '<div class="or-body" id="orHomeBody" tabindex="0"></div>' +
      '<div class="or-statusbar" id="orHomeStatus"></div>' +
      '<div class="or-pagectrl"><button type="button" id="orHomeUp">\u25b2 PAGE UP</button><button type="button" id="orHomeDown">\u25bc PAGE DOWN</button></div>';
    document.body.appendChild(orScreen);
    orBody = orScreen.querySelector("#orHomeBody");
    orStatus = orScreen.querySelector("#orHomeStatus");
    orScreen.querySelector("#orHomeUp").addEventListener("click", function () { orBody.scrollTop -= orBody.clientHeight * 0.8; });
    orScreen.querySelector("#orHomeDown").addEventListener("click", function () { orBody.scrollTop += orBody.clientHeight * 0.8; });

    var menu = orScreen.querySelector("#orHomeMenu");
    [["HOME", "home"], ["MINIWIN", "miniwin"], ["GITHUB", "github"], ["GUI", "gui"]].forEach(function (it) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = it[0];
      b.addEventListener("click", function () { orMenu(it[1]); });
      menu.appendChild(b);
    });

    orBody.innerHTML = "";
    var win = document.createElement("div");
    win.className = "or-window";
    var title = document.createElement("div");
    title.className = "or-win-title";
    title.textContent = "1. HOME";
    win.appendChild(title);
    var d = MAIN_I18N[mainLang()];
    title.textContent = d.orHome;
    var text = document.createElement("pre");
    text.textContent =
      "SEGFAULT777\n\n" + d.intro + "\n\n" +
      "[ MINIWIN ]  " + d.orMiniwinDesc + "\n" +
      "[ GITHUB  ]  https://github.com/SegFault777";
    win.appendChild(text);
    orBody.appendChild(win);

    orStatus.textContent = d.orStatus;
    /* typing RETRO returns to the GUI, as in MiniWin (bound once) */
    if (!orKeysBound) document.addEventListener("keydown", function (e) {
      if (!document.body.classList.contains("oldretro-mode") || miniwinOpen) return;
      if (e.key && e.key.length === 1) orBuf = (orBuf + e.key.toLowerCase()).slice(-5);
      if (orBuf === "retro") { orBuf = ""; orMenu("gui"); }
    });
    orKeysBound = true;
  }

  function orMenu(name) {
    if (name === "home") show("home");
    else if (name === "miniwin") show("miniwin");
    else if (name === "github") window.open("https://github.com/SegFault777", "_blank", "noopener");
    else if (name === "gui") send({ miniwin: "exitOldRetro" });
  }

  function syncOldRetroHome() {
    var on = document.body.classList.contains("oldretro-mode");
    if (on) buildOldRetroHome();
    if (!orScreen) return;
    var show_ = on && !miniwinOpen;
    if (show_) {
      var hb = document.querySelector("header.top");
      orScreen.style.top = (hb ? Math.round(hb.getBoundingClientRect().bottom) : 52) + "px";
    }
    orScreen.style.display = show_ ? "" : "none";
  }

  /* The theme's stylesheets, loaded once from MiniWin's folder. */
  function applySheets(list) {
    (list || []).forEach(function (href) {
      if (!href || loadedSheets[href]) return;
      loadedSheets[href] = true;
      var c = document.createElement("link");
      c.rel = "stylesheet";
      c.href = "miniwin/" + href;
      document.head.appendChild(c);
    });
  }

  /* The Retro / Modern switch shown in this header. Its state comes from MiniWin. */
  function renderSwitch(state) {
    if (!slot.firstElementChild) {
      slot.innerHTML =
        '<div class="style-switch" role="group" aria-label="Visual style">' +
        '<span class="style-label"></span>' +
        '<button class="style-toggle" type="button"><span></span></button>' +
        '<span class="style-label"></span></div>';
      slot.querySelector("button").addEventListener("click", function () {
        send({ miniwin: "toggleStyle" });
      });
    }
    var labels = slot.querySelectorAll(".style-label");
    (state.switchLabels || []).forEach(function (t, i) { if (labels[i]) labels[i].textContent = t; });
    var b = slot.querySelector("button");
    b.setAttribute("aria-pressed", state.pressed || "false");
    b.setAttribute("aria-label", "Switch between Retro and Modern");
  }

  window.addEventListener("message", function (e) {
    if (e.source !== frame.contentWindow || !e.data || !e.data.miniwin) return;
    var m = e.data;
    if (m.miniwin === "ready") {
      ready = true;
      queue.splice(0).forEach(send);
    } else if (m.miniwin === "state") {
      applyBodyClasses(m);
      applySheets(m.sheets);
      renderSwitch(m);
    } else if (m.miniwin === "settingsClosed") {
      /* hide our layer first, then let MiniWin drop its settings-only mode: no frame of MiniWin shows */
      view.classList.remove("settings-only");
      send({ miniwin: "clearSettingsOnly" });
    }
  });

  function show(name) {
    miniwinOpen = name === "miniwin";
    /* entering MiniWin: if the settings were drawn over Home, MiniWin's own page must show again behind them */
    if (miniwinOpen) send({ miniwin: "clearSettingsOnly" });
    view.classList.toggle("open", miniwinOpen);
    view.classList.remove("settings-only");
    back.style.display = miniwinOpen ? "block" : "none";
    navLinks.forEach(function (a) { a.classList.toggle("active", a.getAttribute("data-view") === name); });
    applyBodyClasses({ html: document.documentElement.className, body: document.body.className });
  }

  links.forEach(function (a) {
    a.addEventListener("click", function (e) {
      var name = a.getAttribute("data-view");
      if (!name) return;
      e.preventDefault();
      show(name);
    });
  });
  back.addEventListener("click", function () { show("home"); });

  function mainLang() {
    var lang = "en";
    try {
      lang = localStorage.getItem("miniwin-language") || "en";
      if (lang === "ko" && localStorage.getItem("miniwin-kp-default") === "1") lang = "ko-kp";
    } catch (e) {}
    return MAIN_I18N[lang] ? lang : "en";
  }
  var homeLink = document.querySelector('header.top nav.nav a[data-view="home"]');
  var liveLink = document.getElementById("liveEditorLink");
  function applyMainLang() {
    var d = MAIN_I18N[mainLang()];
    if (homeLink) homeLink.textContent = d.home;
    if (noticeEl) noticeEl.textContent = d.notice;
    var intro = document.getElementById("heroIntro"), run = document.getElementById("heroRun");
    if (intro) intro.textContent = d.intro;
    if (run) run.textContent = d.run;
    if (orScreen) { orScreen.remove(); orScreen = null; }   /* rebuilt in the new language */
    syncOldRetroHome();
    document.documentElement.lang = mainLang() === "ko-kp" ? "ko" : mainLang();
  }
  window.addEventListener("storage", function (e) {
    if (e.key === "miniwin-language" || e.key === "miniwin-kp-default") applyMainLang();
  });

  /* Live Editor is not ready yet: show a short notice and keep the current view */
  var notice = document.createElement("div");
  noticeEl = notice;
  notice.id = "devNotice";
  notice.setAttribute("role", "status");
  notice.textContent = "Live Editor \u2014 \uac1c\ubc1c \uc911\uc785\ub2c8\ub2e4.";
  document.body.appendChild(notice);
  var noticeTimer = null;
  document.getElementById("liveEditorLink").addEventListener("click", function (e) {
    e.preventDefault();
    notice.classList.add("show");
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(function () { notice.classList.remove("show"); }, 2000);
  });

  applyMainLang();

  gear.addEventListener("click", function () {
    if (miniwinOpen) {
      /* MiniWin is on screen: keep it, the settings window opens over it */
      send({ miniwin: "openSettings", onlySettings: false });
      return;
    }
    /* Home is on screen: the settings window floats over the home page */
    view.classList.add("settings-only");
    back.style.display = "none";
    applyBodyClasses({ html: document.documentElement.className, body: document.body.className });
    send({ miniwin: "openSettings", onlySettings: true });
  });
})();
